<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro de Procedimientos 2025</title>
<style>
/* Layout: riel lateral con línea arterial de avance (escritorio) y barra de pasos fija (celular);
   cada paso es una lista de filas "concepto + cifra" pensada para teclear rápido. */
:root{
  --bg:#F8F9FB; --surface:#FFFFFF; --surface-2:#F3F5F8; --ink:#16202B; --muted:#5A6676;
  --line:#E1E6EC; --line-strong:#BEC7D1;
  --accent:#1F2A37; --accent-ink:#FFFFFF; --accent-soft:#EDF0F4; --artery:#C4161C;
  --ok:#1B7A4B; --ok-soft:#E1F3E9; --warn:#855400; --warn-soft:#FBF1D6; --bad:#B42318; --bad-soft:#FCE8E5;
  --font-display:'Segoe UI Variable Display','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --font-body:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --font-mono:ui-monospace,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font-body);padding-block:16px 112px;padding-inline:16px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,p{margin:0}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.opt{font-weight:400;color:var(--muted);font-size:13px}
.hint{color:var(--muted);font-size:13px}

.app{max-width:1120px;margin-inline:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.rail{display:grid;gap:20px;min-width:0}
.eyebrow{font:500 11px/1.4 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.brand{display:grid;gap:8px;justify-items:start}
.logo{display:block;width:72px;height:72px;border-radius:6px;border:1px solid var(--line)}
.brand h1{font:700 26px/1.1 var(--font-display);text-wrap:balance}
.brand h1 span{color:var(--artery)}
.period{color:var(--muted);font-size:14px}
.navd{display:none}

.chip{display:inline-flex;align-items:center;gap:6px;font:600 11px/1 var(--font-mono);letter-spacing:.05em;text-transform:uppercase;padding:5px 9px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.idle{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}

.meter{height:4px;background:var(--line);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;width:0;background:var(--artery);transition:width .25s ease}

/* barra de pasos (celular) */
.mbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;background:var(--bg);padding-block:8px;display:grid;gap:8px;min-width:0}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.cstep{flex:none;display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 12px 0 6px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap}
.cstep b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--surface-2);font:600 12px var(--font-mono);color:var(--muted)}
.cstep.done b{background:var(--artery);color:#fff}
.cstep.partial b{background:var(--warn-soft);color:var(--warn)}
.cstep.current{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}

/* riel (escritorio) */
.steps{list-style:none;margin:0;padding:0}
.steps li{position:relative}
.steps li::before{content:"";position:absolute;left:15px;top:38px;bottom:-6px;width:2px;background:var(--line)}
.steps li:last-child::before{display:none}
.steps li.done::before{background:var(--artery)}
.step-btn{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start;width:100%;padding:6px 0 14px;background:none;border:0;text-align:left;cursor:pointer;border-radius:6px}
.node{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:600 13px var(--font-mono);background:var(--surface);border:2px solid var(--line-strong);color:var(--muted);transition:box-shadow .2s}
.done .node{background:var(--artery);border-color:var(--artery);color:#fff}
.partial .node{border-color:var(--warn);color:var(--warn)}
.current .node{border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.done.current .node{color:#fff}
.slabel{display:grid;line-height:1.3;padding-top:2px}
.slabel strong{font-weight:600}
.slabel small{color:var(--muted);font-size:12.5px}
.current .slabel strong{color:var(--accent)}
.ov{display:grid;gap:6px;margin-top:6px;padding-top:14px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}
.ovrow{display:flex;justify-content:space-between}

@media (min-width:960px){
  body{padding-block:32px 112px}
  .app{grid-template-columns:288px minmax(0,1fr);gap:48px}
  .rail{position:sticky;top:32px;align-self:start}
  .navd{display:block}
  .mbar{display:none}
  .brand h1{font-size:30px}
  .logo{width:104px;height:104px}
}

/* tarjeta de paso */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0;box-shadow:0 1px 2px rgba(22,32,43,.04)}
@media (min-width:600px){.card{padding:28px}}
.shead{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.shead h2{font:600 22px/1.2 var(--font-display);text-wrap:balance;margin-block:4px 6px}
.shead h2:focus{outline:none}
.lead{color:var(--muted);max-width:62ch}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:18px}
.span2{grid-column:1/-1}
.field{display:grid;gap:6px;align-content:start;min-width:0}
.field>label{font-weight:500}
.txt{width:100%;height:44px;padding:0 12px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);min-width:0}
select.txt{appearance:auto}
.txt:focus{border-color:var(--accent)}
.txt[aria-invalid="true"]{border-color:var(--bad)}
.err{color:var(--bad);font-size:13px}
.sub{font:600 15px var(--font-display);margin:28px 0 4px}

.tools{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:12px 14px;margin-bottom:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px}
.tools .hint{flex-basis:100%;color:var(--warn)}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;flex:1 1 280px;min-width:0;font-size:14px}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.track{flex:none;width:40px;height:24px;border-radius:12px;background:var(--line-strong);position:relative;transition:background .15s}
.track::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+.track{background:var(--accent)}
.switch input:checked+.track::after{transform:translateX(16px)}
.switch input:focus-visible+.track{outline:2px solid var(--accent);outline-offset:2px}

.nrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.nrow:first-child{border-top:0}
.nlabel{font-weight:500;min-width:0}
.nlabel small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.num{width:112px;height:44px;padding:0 12px;text-align:right;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);font:500 17px var(--font-mono);font-variant-numeric:tabular-nums}
.num:focus{border-color:var(--accent)}
.num.filled{background:var(--accent-soft);border-color:var(--accent)}
.num.zero{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.num[aria-invalid="true"]{border-color:var(--bad);background:var(--bad-soft)}
.nmsg{grid-column:1/-1;font-size:13px}
.nmsg.bad{color:var(--bad)}
.nmsg.warn{color:var(--warn)}

.others{margin-top:24px;padding-top:20px;border-top:1px solid var(--line-strong);display:grid;gap:10px}
.others h3,.team h3{font:600 15px var(--font-display)}
.orow{display:grid;grid-template-columns:minmax(0,1fr) 112px 44px;gap:8px;align-items:center}
.srow{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;align-items:center}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:8px;min-width:0}
.team{display:grid;gap:10px;margin-top:28px;padding-top:20px;border-top:1px solid var(--line-strong)}

.btn{height:44px;padding:0 18px;border-radius:6px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{height:36px;padding:0 12px;font-size:13px;justify-self:start}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon{width:44px;height:44px;display:grid;place-items:center;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--muted);cursor:pointer}
.icon:hover{color:var(--bad);border-color:var(--bad)}

/* maqueta */
.demo{margin-bottom:16px;border-style:dashed;border-color:var(--line-strong);background:var(--surface-2)}
.demo summary{cursor:pointer;font:600 15px var(--font-display);list-style-position:inside}
.changes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:12px 28px;list-style:none;margin:16px 0;padding:0}
.changes li{font-size:14px;color:var(--muted);min-width:0}
.changes b{color:var(--ink);display:block;font-weight:600}
.demoact{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* revisión */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{padding:14px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.sv{font:600 26px/1.1 var(--font-mono);font-variant-numeric:tabular-nums}
.sl{font-size:12.5px;color:var(--muted);margin-top:4px}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.rrow:first-of-type{border-top:0}
.rrow strong{display:block;font-weight:600}
.rrow small{color:var(--muted);font-size:13px}
.issue{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:8px;margin-top:8px;font-size:14px}
.issue.bad{background:var(--bad-soft);color:var(--bad)}
.issue.warn{background:var(--warn-soft);color:var(--warn)}
.issue span{min-width:0}
@media (max-width:520px){
  .rrow{grid-template-columns:minmax(0,1fr) auto}
  .rrow .btn{grid-column:1/-1;justify-self:stretch}
}

/* barra inferior */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.bar__in{max-width:1120px;margin-inline:auto;display:flex;gap:12px;align-items:center;justify-content:space-between}
.bstat{flex:1;min-width:0;text-align:center;font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.done-card{text-align:left;display:grid;gap:14px;justify-items:start}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<style>
html{color-scheme:light}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
</style>
</head>

function issues(){
  var out=[],total=n('ptca_total'),iam=n('ptca_iam');
  if(iam>total)out.push({lvl:'bad',key:'ptca_iam',step:idx('coro'),msg:'Las angioplastias en el IAM ('+iam+') superan las angioplastias totales ('+total+').'});
  if(n('radial')>n('coronariografias')+total)out.push({lvl:'warn',key:'radial',step:idx('coro'),msg:'El acceso radial ('+n('radial')+') supera la suma de coronariografías y angioplastias. Revise el dato.'});
  return out;
}
function allDone(){
  for(var i=0;i<LAST;i++){if(stat(i).state!=='done')return false;}
  return !issues().some(function(x){return x.lvl==='bad';});
}
function overall(){
  var t=0,f=0;
  for(var i=0;i<LAST;i++){var s=stat(i);t+=s.total;f+=s.filled;}
  return {t:t,f:f,pct:t?Math.round(f/t*100):0};
}

/* ---------- HTML de cada paso ---------- */

  var val=S.info[f.k]==null?'':S.info[f.k], id='f_'+f.k, ctl;
  if(f.type==='select'){
    ctl='<select id="'+id+'" class="txt" data-info="'+f.k+'"><option value="">Elegir…</option>'+PROV.map(function(p){return '<option'+(p===val?' selected':'')+'>'+p+'</option>';}).join('')+'</select>';
  }else{
    ctl='<input id="'+id+'" class="txt" data-info="'+f.k+'" type="'+f.type+'" value="'+esc(val)+'" autocomplete="'+(f.ac||'off')+'"'+(f.type==='tel'?' inputmode="tel"':'')+(f.ph?' placeholder="'+esc(f.ph)+'"':'')+'>';
  }
  return '<div class="field'+(f.span?' span2':'')+'"><label for="'+id+'">'+f.label+(f.req?'':' <span class="opt">(opcional)</span>')+'</label>'+ctl+(f.hint?'<div class="hint">'+f.hint+'</div>':'')+'<div class="err" id="e_'+f.k+'" hidden></div></div>';

function reviewHTML(){
  var f1=n('ptca_total');
  var pct=f1>0?Math.round(n('ptca_iam')/f1*100)+' %':'—';
  var spa=f1>0?(n('stents')/f1).toFixed(2).replace('.',','):'—';
  function stt(v,l){return '<div class="stat"><div class="sv">'+v+'</div><div class="sl">'+l+'</div></div>';}
  var stats='<div class="stats">'+stt(n('coronariografias'),'Coronariografías')+stt(f1,'Angioplastias totales')+stt(pct,'Angioplastias en IAM sobre el total')+stt(spa,'Stents por angioplastia')+stt(n('radial'),'Acceso radial')+stt(n('tavi'),'TAVI')+'</div>';
  var pending=false;
  var rows=STEPS.slice(0,LAST).map(function(st,i){
    var s=stat(i), cls=s.state==='done'?'ok':'warn', label=s.text, sm='';
    if(s.text==='Sin actividad')cls='idle';
    if(st.kind==='num'){
      var act=st.items.filter(function(it){return n(it[0])>0;}).length;
      sm=act+' de '+st.items.length+' con actividad';
      if(s.state!=='done')pending=true;
    }
    return '<div class="rrow"><div><strong>'+st.short+'</strong><small>'+(sm||st.title)+'</small></div><span class="chip '+cls+'">'+label+'</span><button class="btn small" type="button" data-act="jump" data-i="'+i+'">'+(s.state==='done'?'Editar':'Completar')+'</button></div>';
  }).join('');
  var iss=issues().map(function(x){
    return '<div class="issue '+x.lvl+'"><span>'+x.msg+'</span><button class="btn small" type="button" data-act="jump" data-i="'+x.step+'">Revisar</button></div>';
  }).join('');
  var fill=pending?'<div style="margin-top:16px"><button class="btn" type="button" data-act="fill-zero-all">Completar con 0 los vacíos de todas las secciones</button></div>':'';
  return '<h3 class="sub" style="margin-top:0">Indicadores calculados</h3>'+stats+
    '<h3 class="sub">Estado por sección</h3><div>'+rows+'</div>'+fill+
    (iss?'<h3 class="sub">Para revisar</h3>'+iss:'')+'<div class="issue bad" id="sendMsg" role="alert" style="margin-top:16px"'+(sendError?'':' hidden')+'>'+esc(sendError)+'</div>';

  if(ENDPOINT){
    return '<section class="card done-card"><span class="chip ok">Registro recibido</span><h2 style="font:600 22px/1.2 var(--font-display)">Gracias por completar el registro</h2><p class="lead">Recibimos los datos de '+esc(doneName||'su institución')+'.'+(mailedCopy?' Le enviamos una copia de sus respuestas al correo indicado.':'')+'</p><div class="demoact"><button class="btn" type="button" data-act="clear">Cargar otro registro</button></div></section>';

/* ---------- render ---------- */
function renderStage(){
  if(submitted){stage.innerHTML=doneHTML();bar.hidden=true;updateNav();return;}
  bar.hidden=false;
  var st=STEPS[S.step], body='';
  if(st.kind==='info'){body='<div class="grid2">'+st.fields.map(fieldHTML).join('')+'</div>';}
  else if(st.kind==='team'){
    body='<h3 class="sub" style="margin-top:0">Jefe de servicio</h3><div class="grid2">'+st.fields.map(fieldHTML).join('')+'</div>'+
    '<div class="team"><h3>Staff del servicio <span class="opt">(opcional)</span></h3><p class="hint">Agregue a cada profesional del equipo. Puede quitar o sumar filas cuando quiera.</p><div id="staffList" style="display:grid;gap:8px">'+staffHTML()+'</div><button class="btn small" type="button" data-act="add-staff">+ Agregar profesional</button></div>';
  }
  else if(st.kind==='num'){body=numHTML(st);}
  else{body=reviewHTML();}
  stage.innerHTML=(S.step===0?demoHTML():'')+
    '<section class="card" aria-labelledby="stTitle"><header class="shead"><div><div class="eyebrow">Paso '+(S.step+1)+' de '+STEPS.length+'</div><h2 id="stTitle" tabindex="-1">'+st.title+'</h2><p class="lead">'+st.lead+'</p></div><span class="chip" id="stChip"></span></header>'+body+'</section>';
  refresh();
}
function chipFor(i){
  var s=stat(i);
  var cls=s.state==='done'?'ok':(s.state==='partial'?'warn':'idle');
  if(s.text==='Sin actividad')cls='idle';
  return {cls:cls,text:s.text};
}
function updateNav(){
  var li='',ch='';
  for(var i=0;i<STEPS.length;i++){
    var s=stat(i), st=STEPS[i];
    var cls=(s.state==='done'?'done':(s.state==='partial'?'partial':''))+(i===S.step?' current':'');
    li+='<li class="'+cls+'"><button class="step-btn" type="button" data-go="'+i+'"'+(i===S.step?' aria-current="step"':'')+'><span class="node">'+(s.state==='done'?CHECK:(i+1))+'</span><span class="slabel"><strong>'+st.short+'</strong><small>'+s.text+'</small></span></button></li>';
    ch+='<button class="cstep '+cls+'" type="button" data-go="'+i+'"'+(i===S.step?' aria-current="step"':'')+'><b>'+(s.state==='done'?CHECK:(i+1))+'</b>'+st.short+'</button>';
  }
  $('#steps').innerHTML=li;
  var chips=$('#chips');
  chips.innerHTML=ch;
  var cur=chips.querySelector('.current');
  if(cur){chips.scrollLeft=cur.offsetLeft-chips.clientWidth/2+cur.clientWidth/2;}
  var o=overall();
  $('#ovTxt').textContent=o.f+' de '+o.t;
  $('#ovBar').style.width=o.pct+'%';
  $('#mBar').style.width=o.pct+'%';
}
function updateDraft(){
  var el=$('#draft');
  if(!storageOK){el.textContent='El borrador no se guarda en este navegador';return;}
  if(savedAt){el.textContent='Borrador guardado · '+savedAt.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});return;}
  el.textContent='Los cambios se guardan solos';
}
function updateBar(){
  $('#prev').disabled=S.step===0;
  var nx=$('#next');
  if(S.step===LAST){nx.textContent=sending?'Enviando…':'Enviar registro';nx.disabled=sending||!allDone();}
  else{nx.textContent='Siguiente';nx.disabled=false;}
  updateDraft();
}
function updateRowStates(){
  var iss=issues();
  stage.querySelectorAll('.nrow').forEach(function(row){
    var k=row.dataset.row, v=S.v[k]==null?'':S.v[k];
    var inp=row.querySelector('.num'), m=row.querySelector('.nmsg');
    inp.classList.toggle('filled',v!==''&&v!=='0');
    inp.classList.toggle('zero',v==='0');
    var is=null;for(var j=0;j<iss.length;j++){if(iss[j].key===k)is=iss[j];}
    if(flash[k]){m.textContent='Solo números enteros, sin letras ni símbolos.';m.className='nmsg warn';m.hidden=false;}
    else if(is){m.textContent=is.msg;m.className='nmsg '+is.lvl;m.hidden=false;if(is.lvl==='bad')inp.setAttribute('aria-invalid','true');else inp.removeAttribute('aria-invalid');}
    else{m.hidden=true;inp.removeAttribute('aria-invalid');}
  });
  var nope=$('#nope');
  if(nope)nope.checked=isZero(STEPS[S.step]);
}
function updateFieldErrors(){
  var st=STEPS[S.step];
  if(!st.fields)return;
  st.fields.forEach(function(f){
    var e=$('#e_'+f.k), inp=$('#f_'+f.k);
    if(!e)return;
    var msg=touched[f.k]?fieldErr(f,S.info[f.k]):'';
    e.textContent=msg;e.hidden=!msg;
    if(inp){if(msg)inp.setAttribute('aria-invalid','true');else inp.removeAttribute('aria-invalid');}
  });
}
function updateHead(){
  var c=$('#stChip');
  if(!c)return;
  if(S.step===LAST){var d=allDone();c.className='chip '+(d?'ok':'warn');c.textContent=d?'Listo para enviar':'Faltan datos';return;}
  var ch=chipFor(S.step);
  c.className='chip '+ch.cls;c.textContent=ch.text;
}
function refresh(){
  if(submitted)return;
  updateNav();updateBar();updateHead();
  if(STEPS[S.step].kind==='num')updateRowStates();
  updateFieldErrors();
}
function syncInputs(){
  stage.querySelectorAll('[data-num]').forEach(function(el){
    var v=S.v[el.dataset.num]==null?'':S.v[el.dataset.num];
    if(el.value!==v)el.value=v;
  });
}
function renderOthers(){var l=$('#oList');if(l)l.innerHTML=othersRowsHTML(STEPS[S.step]);}
function renderStaff(){var l=$('#staffList');if(l)l.innerHTML=staffHTML();}

function go(i){
  S.step=Math.max(0,Math.min(LAST,i));
  save();renderStage();
  window.scrollTo(0,0);
  var h=$('#stTitle');
  if(h)h.focus({preventScroll:true});
}

/* ---------- envío ---------- */
function newId(){
  if(window.crypto&&crypto.randomUUID)return crypto.randomUUID();
  return Date.now().toString(36)+Math.random().toString(36).slice(2,10);
}
function buildPayload(){
  var f=[];
  INST.forEach(function(x){f.push(['Institución · '+x.label,String(S.info[x.k]||'').trim()]);});
  JEFE.forEach(function(x){f.push(['Jefe de servicio · '+x.label,String(S.info[x.k]||'').trim()]);});
  f.push(['Staff del servicio',S.staff.filter(function(p){return String(p.n).trim();}).map(function(p){return String(p.n).trim()+' ('+p.r+')';}).join('; ')]);
  STEPS.forEach(function(st){
    if(st.kind!=='num')return;
    st.items.forEach(function(it){f.push([st.short+' · '+it[1],n(it[0])]);});
    if(st.others){
      f.push(['Otras · '+st.short,(S.o[st.id]||[]).filter(function(r){return String(r.n).trim()||r.q;}).map(function(r){return (String(r.n).trim()||'Sin nombre')+': '+(parseInt(r.q,10)||0);}).join('; ')]);
    }
  });
  return {token:TOKEN,id:S.sid,copiaA:String(S.info.email||'').trim(),fields:f};
}
function showSendErr(msg){
  sendError=msg||'';
  var el=$('#sendMsg');
  if(el){el.textContent=sendError;el.hidden=!sendError;}
}
function doSubmit(){
  if(!ENDPOINT){submitted=true;renderStage();window.scrollTo(0,0);return;}
  if(sending)return;
  if(!S.sid){S.sid=newId();}
  save();
  sending=true;showSendErr('');updateBar();
  var ctrl=window.AbortController?new AbortController():null;
  var timer=setTimeout(function(){if(ctrl)ctrl.abort();},30000);
  fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(buildPayload()),signal:ctrl?ctrl.signal:undefined})
    .then(function(r){return r.json();})
    .then(function(res){
      clearTimeout(timer);
      if(!res||!res.ok)throw new Error('rechazado');
      sending=false;
      doneName=S.info.hospital||'';
      mailedCopy=!!res.mailed;
      S=blank();touched={};
      try{localStorage.removeItem(KEY);}catch(_){}
      submitted=true;renderStage();window.scrollTo(0,0);
    })
    .catch(function(){
      clearTimeout(timer);
      sending=false;
      showSendErr('No pudimos confirmar el envío. Revise su conexión y vuelva a tocar "Enviar registro". Si ya se había enviado, no se duplica.');
      updateBar();
    });
}

/* ---------- eventos ---------- */
function act(name,el){
  var st=STEPS[S.step];
  if(name==='prev'){go(S.step-1);return;}
  if(name==='next'){
    if(S.step<LAST){go(S.step+1);}
    else if(allDone()){doSubmit();}
    return;
  }
  if(name==='jump'){go(parseInt(el.dataset.i,10));return;}
  if(name==='add-staff'){S.staff.push({n:'',r:ROLES[0]});renderStaff();var ins=stage.querySelectorAll('[data-sn]');if(ins.length)ins[ins.length-1].focus();save();return;}
  if(name==='rm-staff'){S.staff.splice(parseInt(el.dataset.i,10),1);renderStaff();save();return;}
  if(name==='add-other'){S.o[st.id]=S.o[st.id]||[];S.o[st.id].push({n:'',q:''});renderOthers();var on=stage.querySelectorAll('[data-oname]');if(on.length)on[on.length-1].focus();save();refresh();return;}
  if(name==='rm-other'){S.o[st.id].splice(parseInt(el.dataset.i,10),1);renderOthers();save();refresh();return;}
  if(name==='fill-zero'){st.items.forEach(function(it){if((S.v[it[0]]==null?'':S.v[it[0]])==='')S.v[it[0]]='0';});syncInputs();save();refresh();return;}
  if(name==='fill-zero-all'){STEPS.forEach(function(s){if(s.kind==='num')s.items.forEach(function(it){if((S.v[it[0]]==null?'':S.v[it[0]])==='')S.v[it[0]]='0';});});save();renderStage();return;}
  if(name==='sample'){S=sample();touched={};submitted=false;save();renderStage();return;}
  if(name==='clear'){S=blank();touched={};flash={};sending=false;sendError='';submitted=false;save();renderStage();window.scrollTo(0,0);return;}
  if(name==='back-review'){submitted=false;renderStage();return;}
}
document.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]');
  if(g){go(parseInt(g.dataset.go,10));return;}
  var a=e.target.closest('[data-act]');
  if(a)act(a.dataset.act,a);
});
function cleanNum(t){
  var raw=t.value, x=raw.replace(/\D/g,'').slice(0,6).replace(/^0+(?=\d)/,'');
  if(x!==raw)t.value=x;
  return {val:x,stripped:raw.replace(/\d/g,'')!==''};
}
stage.addEventListener('input',function(e){
  var t=e.target, st=STEPS[S.step];
  if(t.dataset.num){
    var r=cleanNum(t);
    S.v[t.dataset.num]=r.val;
    if(r.stripped){var k=t.dataset.num;flash[k]=true;setTimeout(function(){delete flash[k];if(STEPS[S.step].kind==='num')updateRowStates();},2200);}
  }else if(t.dataset.oqty!==undefined){
    var r2=cleanNum(t);S.o[st.id][parseInt(t.dataset.oqty,10)].q=r2.val;
  }else if(t.dataset.oname!==undefined){
    S.o[st.id][parseInt(t.dataset.oname,10)].n=t.value;
  }else if(t.dataset.info){
    S.info[t.dataset.info]=t.value;
  }else if(t.dataset.sn!==undefined){
    S.staff[parseInt(t.dataset.sn,10)].n=t.value;
  }else if(t.dataset.sr!==undefined){
    S.staff[parseInt(t.dataset.sr,10)].r=t.value;
  }else{return;}
  save();refresh();
});
stage.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='nope'){
    var st=STEPS[S.step], msg=$('#nopeMsg');
    if(t.checked){
      var any=st.items.some(function(it){return n(it[0])>0;})||(S.o[st.id]||[]).some(function(r){return parseInt(r.q,10)>0;});
      if(any){t.checked=false;msg.hidden=false;return;}
      st.items.forEach(function(it){S.v[it[0]]='0';});
      S.o[st.id]=[];renderOthers();
    }else{
      st.items.forEach(function(it){S.v[it[0]]='';});
    }
    msg.hidden=true;syncInputs();save();refresh();
  }
});
stage.addEventListener('focusout',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.info){touched[t.dataset.info]=true;updateFieldErrors();}
});
stage.addEventListener('keydown',function(e){
  var t=e.target;
  if(e.key==='Enter'&&t.classList&&t.classList.contains('num')){
    e.preventDefault();
    var all=Array.prototype.slice.call(stage.querySelectorAll('.num')), i=all.indexOf(t);
    if(i>-1&&i<all.length-1){all[i+1].focus();all[i+1].select();}
    else{$('#next').focus();}
  }
});

updateDraft();
renderStage();
})();
</script>
</body>
</html>
